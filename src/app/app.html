<!-- src/app/app.html -->
<div class="container">
  <h1>{{ title }}</h1>

  <section class="form-section">
    <h2>Add person</h2>

    <form [formGroup]="form" (ngSubmit)="addPerson()">
      <div class="form-row">
        <label>
          Name:
          <input formControlName="name" type="text" />
        </label>
      </div>

      <div class="form-row">
        <label>
          Birth date:
          <input formControlName="birthDate" type="date" />
        </label>
      </div>

      <button type="submit">Add</button>
    </form>
  </section>

  <section class="list-section">
    <h2>People in DB</h2>

    <div *ngIf="loading">Loading...</div>
    <div *ngIf="error" class="error">{{ error }}</div>

    <table *ngIf="!loading && people.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Birth Date</th>
          <th>Days Alive</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of people">
          <td>{{ p.id }}</td>
          <td>{{ p.name }}</td>
          <td>{{ p.birthDate }}</td>
          <td>{{ p.daysAlive }}</td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="!loading && people.length === 0">
      No people yet. Add one above.
    </p>
  </section>
</div>
